<!-- NOTE: Replacing this file (priya-avatar.svg) with a real photo of the same name updates it everywhere across the application. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="60" />
    </clipPath>
  </defs>

  <!-- Circular background with soft fill #E8EEFF -->
  <circle cx="60" cy="60" r="60" fill="#E8EEFF" />

  <g clip-path="url(#circleClip)">
    <!-- Back Hair -->
    <path d="M30,55 C30,22 90,22 90,55 C90,82 82,95 82,95 L38,95 C38,95 30,82 30,55 Z" fill="#0B1220" />

    <!-- Shoulders & Dark Green Blouse (#123C2D) -->
    <path d="M12,120 C14,96 36,86 60,86 C84,86 106,96 108,120 Z" fill="#123C2D" />

    <!-- Blouse V-Neck with Emerald Accent (#10B981) -->
    <path d="M48,86 L60,102 L72,86 Z" fill="#10B981" />
    <path d="M52,86 L60,98 L68,86 Z" fill="#F4F7FB" />

    <!-- Neck -->
    <rect x="52" y="70" width="16" height="18" rx="4" fill="#E5A67C" />

    <!-- Face Base -->
    <ellipse cx="60" cy="56" rx="22" ry="25" fill="#F0B58D" />

    <!-- Cheeks & Blush -->
    <circle cx="45" cy="62" r="4.5" fill="#EFA286" opacity="0.6" />
    <circle cx="75" cy="62" r="4.5" fill="#EFA286" opacity="0.6" />

    <!-- Smiling Mouth -->
    <path d="M52,65 Q60,74 68,65" fill="none" stroke="#873528" stroke-width="2.5" stroke-linecap="round" />
    <path d="M54,66 Q60,71 66,66 Z" fill="#FFFFFF" />

    <!-- Nose -->
    <path d="M60,57 Q61,61 58,62" fill="none" stroke="#D18861" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (Friendly smiling crescents) -->
    <path d="M44,52 Q49,48 54,52" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="49" cy="53" r="2.2" fill="#0B1220" />
    <circle cx="50" cy="52" r="0.7" fill="#FFFFFF" />

    <path d="M66,52 Q71,48 76,52" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="71" cy="53" r="2.2" fill="#0B1220" />
    <circle cx="72" cy="52" r="0.7" fill="#FFFFFF" />

    <!-- Eyebrows -->
    <path d="M42,46 Q49,42 55,47" fill="none" stroke="#0B1220" stroke-width="2.5" stroke-linecap="round" />
    <path d="M65,47 Q71,42 78,46" fill="none" stroke="#0B1220" stroke-width="2.5" stroke-linecap="round" />

    <!-- Front Hair / Bangs (Modern Style) -->
    <path d="M38,50 C38,30 50,22 60,22 C70,22 82,30 82,50 C82,54 80,62 78,64 C76,54 75,44 65,40 C55,36 43,44 42,64 C40,62 38,54 38,50 Z" fill="#0B1220" />

    <!-- Bindi (Subtle cultural detail) -->
    <circle cx="60" cy="48" r="1.5" fill="#123C2D" />

    <!-- Small Emerald Ear studs (#10B981) -->
    <circle cx="37" cy="59" r="2.5" fill="#10B981" />
    <circle cx="83" cy="59" r="2.5" fill="#10B981" />
  </g>
</svg>
